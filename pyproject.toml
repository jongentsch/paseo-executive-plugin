[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "hermes-paseo-executive"
version = "0.1.0"
description = "Hermes executive assistant for Paseo workers"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115,<1"]

[tool.setuptools.packages.find]
include = ["paseo_executive*"]
